# k8s/mongo.yaml - a MongoDB for the cluster demo (provided).
# The weekly EKS lab's API kept quotes in memory; the capstone API is backed by
# a database, so the cluster needs one too. Data here lives inside the pod and
# resets when the pod does: fine for a demo, never for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# The Service gives the database a stable name: the API's MONGODB_URI points at
# "mongo", and Kubernetes resolves it to whichever pod is currently running.
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017

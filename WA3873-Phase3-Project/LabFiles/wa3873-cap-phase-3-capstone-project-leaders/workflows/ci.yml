# ci.yml - the Evergreen Quote API pipeline (provided).
# Capstone learners: enable this by copying it to .github/workflows/ci.yml in
# your repository. Do not modify it.
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test the API
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the lock file
        run: npm ci

      - name: Run the API tests (the safety net)
        run: npm test

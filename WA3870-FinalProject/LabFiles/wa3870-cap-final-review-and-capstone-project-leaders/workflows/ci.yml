# ci.yml - the Evergreen Quote launch pipeline (provided).
# Capstone learners: enable this by copying it to .github/workflows/ci.yml in
# your repository. Do not modify it.
# Two jobs, because the launch has two halves: the API proves its behavior
# with tests against a throwaway database, and the client proves its
# contracts type-check and its production build succeeds.
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: Test the API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies from the lock file
        run: npm ci

      - name: Run the API tests (the safety net)
        run: npm test

  client-build:
    name: Type-check and build the client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies from the lock file
        run: npm ci

      - name: Type-check (the contracts must hold)
        run: npm run type-check

      - name: Build for production
        run: npm run build

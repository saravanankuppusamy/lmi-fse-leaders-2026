# k8s/deployment.yaml — run the Evergreen API on Kubernetes (Solution)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evergreen-quote-api
  labels:
    app: evergreen-quote-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: evergreen-quote-api
  template:
    metadata:
      labels:
        app: evergreen-quote-api
    spec:
      containers:
        - name: evergreen-quote-api
          image: evergreen-quote-api:1.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
